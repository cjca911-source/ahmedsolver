<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AhmedSolver</title>
  <meta
    name="description"
    content="AhmedSolver is a focused bilingual engineering website for Mohr's Circle and beam deflection analysis."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="home-page">
  <div class="site-backdrop" aria-hidden="true"></div>
  <div class="site-shell">
    <header id="site-navbar"></header>

    <main>
      <section class="hero-home" id="top">
        <div class="hero-copy">
          <span class="hero-eyebrow" data-i18n="home.eyebrow"></span>
          <h1 data-i18n="home.title"></h1>
          <p class="hero-subtitle" data-i18n="home.subtitle"></p>
          <p class="hero-description" data-i18n="home.description"></p>

          <div class="hero-actions">
            <a class="button button-primary" href="pages/mohrs-circle.html" data-i18n="home.primaryCta"></a>
            <a class="button button-secondary" href="pages/beam-deflection.html" data-i18n="home.secondaryCta"></a>
          </div>

          <div class="stat-grid">
            <article class="stat-card glass-card">
              <strong>2</strong>
              <span data-i18n="home.statTools"></span>
            </article>
            <article class="stat-card glass-card">
              <strong>AR / EN</strong>
              <span data-i18n="home.statLanguage"></span>
            </article>
            <article class="stat-card glass-card">
              <strong>SVG</strong>
              <span data-i18n="home.statDrawings"></span>
            </article>
          </div>
        </div>

        <div class="hero-stage glass-card" aria-hidden="true">
          <div class="signal-grid">
            <div class="signal-card">
              <span class="signal-label">Mohr</span>
              <strong data-i18n="home.signalMohrTitle"></strong>
              <p data-i18n="home.signalMohrText"></p>
            </div>
            <div class="signal-card">
              <span class="signal-label">Beam</span>
              <strong data-i18n="home.signalBeamTitle"></strong>
              <p data-i18n="home.signalBeamText"></p>
            </div>
          </div>

          <div class="hero-sketch">
            <div class="sketch-circle"></div>
            <div class="sketch-axis sketch-axis--x"></div>
            <div class="sketch-axis sketch-axis--y"></div>
            <div class="sketch-beam"></div>
            <div class="sketch-support sketch-support--left"></div>
            <div class="sketch-support sketch-support--right"></div>
            <div class="sketch-load"></div>
          </div>
        </div>
      </section>

      <section class="section-block" id="tools">
        <div class="section-heading">
          <span class="section-kicker" data-i18n="home.toolsKicker"></span>
          <h2 data-i18n="home.toolsTitle"></h2>
          <p data-i18n="home.toolsDescription"></p>
        </div>

        <div class="tool-grid">
          <article class="tool-card glass-card">
            <span class="tool-tag" data-i18n="home.mohrsTag"></span>
            <h3 data-i18n="home.mohrsTitle"></h3>
            <p data-i18n="home.mohrsDescription"></p>
            <ul class="tool-points">
              <li data-i18n="home.mohrsPoint1"></li>
              <li data-i18n="home.mohrsPoint2"></li>
              <li data-i18n="home.mohrsPoint3"></li>
            </ul>
            <a class="button button-primary" href="pages/mohrs-circle.html" data-i18n="home.mohrsCta"></a>
          </article>

          <article class="tool-card glass-card">
            <span class="tool-tag" data-i18n="home.beamTag"></span>
            <h3 data-i18n="home.beamTitle"></h3>
            <p data-i18n="home.beamDescription"></p>
            <ul class="tool-points">
              <li data-i18n="home.beamPoint1"></li>
              <li data-i18n="home.beamPoint2"></li>
              <li data-i18n="home.beamPoint3"></li>
            </ul>
            <a class="button button-primary" href="pages/beam-deflection.html" data-i18n="home.beamCta"></a>
          </article>
        </div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <span class="section-kicker" data-i18n="home.focusKicker"></span>
          <h2 data-i18n="home.focusTitle"></h2>
          <p data-i18n="home.focusDescription"></p>
        </div>

        <div class="focus-grid">
          <article class="focus-card glass-card">
            <h3 data-i18n="home.focusCard1Title"></h3>
            <p data-i18n="home.focusCard1Description"></p>
          </article>
          <article class="focus-card glass-card">
            <h3 data-i18n="home.focusCard2Title"></h3>
            <p data-i18n="home.focusCard2Description"></p>
          </article>
          <article class="focus-card glass-card">
            <h3 data-i18n="home.focusCard3Title"></h3>
            <p data-i18n="home.focusCard3Description"></p>
          </article>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </div>

  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
